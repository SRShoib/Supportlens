repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        # M10: the four classical baseline .joblib files (~2.5-3.5MB each)
        # and the demo seed fixtures (~550-710KB) are intentionally
        # committed (docs/decisions.md) -- 4096 covers those with headroom
        # while still catching an accidental transformer export or raw data
        # dump (multi-hundred-MB) landing in a commit by mistake.
        args: [--maxkb=4096]

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run --frozen mypy apps/api ml/inference ml/data ml/evaluation
        language: system
        pass_filenames: false
        stages: [pre-push]
