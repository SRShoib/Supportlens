name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv python install 3.11

      - run: uv sync --all-groups --frozen

      - run: uv run ruff check .

      - run: uv run ruff format --check .

      - run: uv run mypy apps/api ml/inference ml/data

      - run: uv run pytest tests/unit --cov=ml.data.cleaning --cov=ml.data.masking --cov=ml.data.dedup --cov-fail-under=95

      - run: uv run pytest tests/integration -m integration

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: cp .env.example .env

      - run: docker compose --env-file .env -f infra/docker-compose.yml up -d --wait

      - run: curl --fail http://localhost:8000/healthz

      - if: always()
        run: docker compose --env-file .env -f infra/docker-compose.yml down -v
