name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv python install 3.11

      # Default groups (ml + dev) plus `serving` and `search` — the API's
      # real CPU transformer-inference path (M3) and live search/RAG path
      # (M8, chromadb included) are both production code and get tested for
      # real, unlike `training` (GPU-fine-tuning-only, deliberately
      # excluded, matching CLAUDE.md's "no training in this repo's runtime").
      # `search` matters for mypy specifically: pyproject.toml's
      # ignore_missing_imports=true for chromadb.* means an environment
      # without it installed silently types every chromadb.* attribute as
      # Any, which makes ml/inference/vector_store.py's real, load-bearing
      # `# type: ignore[assignment]` comments (needed once chromadb's real
      # types are visible) look unused instead -- warn_unused_ignores=true
      # then fails the build over a false positive caused by the missing
      # dependency, not a real code issue.
      - run: uv sync --frozen --group serving --group search

      - run: uv run ruff check .

      - run: uv run ruff format --check .

      - run: uv run mypy apps/api ml/inference ml/data ml/evaluation

      - run: uv run pytest tests/unit --cov=ml.data.cleaning --cov=ml.data.masking --cov=ml.data.dedup --cov-fail-under=95

      # Separate from the M1 gate above so failure attribution stays clean:
      # a drop here points straight at M4's NER modules, not a general
      # coverage regression.
      - run: uv run pytest tests/unit --cov=ml.data.ner --cov=ml.inference.rules_ner --cov=ml.inference.token_classification --cov=ml.evaluation.span_metrics --cov-fail-under=90

      # Confirms tests/fixtures/models/* still match what
      # scripts/make_stub_models.py would produce -- a cheap guard against
      # the fixtures silently drifting from their own recipe.
      - run: uv run python scripts/make_stub_models.py --check

      - run: uv run pytest tests/integration -m integration

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: cp .env.example .env

      - run: docker compose --env-file .env -f infra/docker-compose.yml up -d --wait

      - run: curl --fail http://localhost:8000/healthz

      - run: curl --fail http://localhost:3000/tickets

      - if: always()
        run: docker compose --env-file .env -f infra/docker-compose.yml down -v
