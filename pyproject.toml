[project]
name = "supportlens"
version = "0.1.0"
description = "Customer Support Intelligence Platform — NLP portfolio project"
requires-python = "==3.11.*"
readme = "README.md"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
ml = [
    "datasets>=3.1",
    "pandas>=2.2",
    "pyarrow>=18.0",
    "ftfy>=6.3",
    "emoji>=2.14",
    "lingua-language-detector>=2.0",
    "tokenizers>=0.20",
    "spacy>=3.8",
    "en-core-web-sm",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "testcontainers[postgres]>=4.9",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[tool.uv]
default-groups = ["ml", "dev"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/api", "ml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PT", "C4", "N"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PT011", "PT012", "B011"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["datasets.*", "lingua.*", "emoji.*", "ftfy.*", "spacy.*", "testcontainers.*", "pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires Docker (testcontainers)",
    "slow: long-running test",
]
addopts = "--strict-markers -q"

[tool.coverage.run]
branch = true
