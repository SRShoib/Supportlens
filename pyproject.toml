[project]
name = "supportlens"
version = "0.1.0"
description = "Customer Support Intelligence Platform — NLP portfolio project"
requires-python = "==3.11.*"
readme = "README.md"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "openai>=1.54",
]

[dependency-groups]
ml = [
    "datasets>=3.1",
    "pandas>=2.2",
    "pyarrow>=18.0",
    "ftfy>=6.3",
    "emoji>=2.14",
    "lingua-language-detector>=2.0",
    "tokenizers>=0.20",
    "spacy>=3.8",
    "en-core-web-sm",
    # M6 ROUGE-1/2/L (ml/evaluation/rouge_metrics.py). A default-group dep
    # (like scikit-learn above it, used by ml/evaluation/metrics.py) rather
    # than `training`-only: ml/evaluation/* is CI-tested code, not GPU-only
    # tooling. Used directly (rouge_score.rouge_scorer), not via
    # evaluate.load("rouge") -- that wrapper fetches a metric script from the
    # HF Hub at eval time; this way stays offline once the package is synced.
    "rouge-score>=0.1",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "testcontainers[postgres]>=4.9",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
]
# GPU fine-tuning deps (M3+). Deliberately excluded from default-groups so a
# plain `uv sync` / CI never pulls these. Torch itself is NOT listed here —
# CLAUDE.md requires the CUDA build to be a manual one-time install matching
# the local driver, documented in docs/decisions.md, not lockfile-pinned.
training = [
    # Upper-bounded: transformers 5.x (as of this writing) has a tokenizer-
    # conversion regression that breaks loading microsoft/deberta-v3-small's
    # SentencePiece tokenizer (misroutes it through a tiktoken BPE parser).
    # Confirmed broken on 5.15.0; the well-established 4.x series does not
    # have this bug. Revisit this pin once upstream fixes it.
    "transformers>=4.46,<5.0",
    "accelerate>=1.0",
    "evaluate>=0.4",
    "pyyaml>=6.0",
    "sentencepiece>=0.2",
    "tiktoken>=0.8",
    "protobuf>=5.0",
]
# CPU inference deps for M3's transformer serving path (apps/api loads real
# fine-tuned exports, SPEC §5: "serving is CPU-only"). Separate from
# `training`: this is real API runtime code, not GPU-only tooling, so it's
# synced into the API Docker image (infra/api.Dockerfile) and into CI — but
# still excluded from default-groups so a plain `uv sync` for data/API work
# unrelated to transformers stays lean. Unlike `training`, torch IS pinned
# here directly: `transformers` doesn't pull it in on its own (torch is an
# optional backend, not a hard dependency). A plain PyPI resolution of
# `torch` on Linux pulls the CUDA build (~2.5GB of nvidia-cu13/triton deps
# it can never use, no GPU in the container) — see the `pytorch-cpu` index
# below, which pins torch to the real CPU-only wheel instead.
serving = [
    "transformers>=4.46,<5.0",
    "torch>=2.2",
    "sentencepiece>=0.2",
    "protobuf>=5.0",
]
# M7's offline topic-discovery pipeline: embed the corpus, fit BERTopic
# (UMAP + HDBSCAN), assign topics back to Postgres. Deliberately its own
# group, not `serving` — the API never loads an embedding or topic model
# (scripts/assign_topics.py writes results to Postgres; apps/api only reads
# them back, see docs/decisions.md), so none of this enters
# infra/api.Dockerfile or CI's default sync. sentence-transformers pulls in
# torch as a hard dependency (unlike `transformers`, where it's an optional
# backend); a plain `uv sync --group topics` resolves it to the CPU wheel
# via the `pytorch-cpu` source below, same as `serving` — swap to the CUDA
# build afterward with the same manual reinstall command documented in
# docs/decisions.md if embedding the corpus locally on GPU.
topics = [
    "sentence-transformers>=3.2",
    "bertopic>=0.16",
    "umap-learn>=0.5",
    "hdbscan>=0.8.40",
]

[tool.uv]
default-groups = ["ml", "dev"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/api", "ml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PT", "C4", "N"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PT011", "PT012", "B011"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "datasets.*",
    "lingua.*",
    "emoji.*",
    "ftfy.*",
    "spacy.*",
    "testcontainers.*",
    "pandas.*",
    "sklearn.*",
    "joblib.*",
    "transformers.*",
    "accelerate.*",
    "evaluate.*",
    "yaml.*",
    "rouge_score.*",
    "sentence_transformers.*",
    "bertopic.*",
    "umap.*",
    "hdbscan.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires Docker (testcontainers)",
    "slow: long-running test",
]
addopts = "--strict-markers -q"

[tool.coverage.run]
branch = true
