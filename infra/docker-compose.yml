name: supportlens

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [supportlens]

  chroma:
    image: chromadb/chroma:0.5.23
    ports:
      - "${CHROMA_PORT}:8000"
    volumes:
      - chromadata:/chroma/chroma
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/heartbeat')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [supportlens]

  api:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "${API_PORT}:8000"
    volumes:
      # Read-only: dropping a newly trained model in models/ takes effect on
      # container restart, no image rebuild needed — deploying code and
      # deploying a model are deliberately decoupled.
      - ../models:/app/models:ro
    depends_on:
      postgres:
        condition: service_healthy
      chroma:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [supportlens]

  dashboard:
    build:
      context: ../apps/dashboard
      dockerfile: ../../infra/dashboard.Dockerfile
    environment:
      # Docker's internal service DNS -- the dashboard's Server Components
      # fetch apps/api directly over the compose network, never through the
      # browser, so there's no CORS surface to configure on the API side.
      API_BASE_URL: http://api:8000
    ports:
      - "${DASHBOARD_PORT}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # No curl/wget baseline on node:alpine's minimal image -- Node itself
      # does the check, same pattern as chroma/api's inline Python probes.
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/tickets', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [supportlens]

networks:
  supportlens:

volumes:
  pgdata:
  chromadata:
